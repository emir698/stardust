<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Stardust Ticket Scan</title>
<style>
:root{--bg:#0a0a0a;--sf:#1a1a1a;--bd:#2a2a2a;--tx:#f0f0f0;--mu:#666;--ac:#e8c547;--gn:#4ade80;--rd:#f87171;--bl:#60a5fa;--sf2:#242424}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;max-width:430px;margin:0 auto}

/* LOGIN */
.login-screen{min-height:100vh;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.login-logo{text-align:center;margin-bottom:2.5rem}
.login-logo .star{font-size:13px;letter-spacing:4px;color:#e8c547;font-weight:700}
.login-logo .name{font-size:28px;font-weight:800;color:#fff;margin-top:8px;letter-spacing:1px}
.login-logo .sub{font-size:11px;color:#555;letter-spacing:3px;margin-top:4px}
.login-card{background:#1a1a1a;border-radius:20px;padding:1.75rem;width:100%;border:1px solid #2a2a2a}
.fl{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:block}
.fi{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:12px;padding:14px 16px;color:#fff;font-size:16px;outline:none;margin-bottom:1rem;-webkit-appearance:none}
.fi:focus{border-color:#e8c547}
.btn-login{width:100%;padding:16px;background:#e8c547;color:#000;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}
.login-err{font-size:13px;color:#f87171;text-align:center;margin-top:12px;min-height:18px}

/* HEADER */
.header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.header-logo{font-size:11px;letter-spacing:3px;color:var(--ac);font-weight:700}
.header-sub{font-size:9px;color:var(--mu);letter-spacing:2px;margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px}
.header-user{font-size:12px;color:var(--mu)}
.btn-logout{background:none;border:1px solid var(--bd);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--mu);cursor:pointer}

/* SEANS SEÇİMİ */
.seans-screen{padding:16px;min-height:100vh}
.screen-title{font-size:24px;font-weight:800;margin-bottom:4px;color:var(--tx)}
.screen-date{font-size:14px;color:var(--mu);margin-bottom:20px}
.seans-kart{background:var(--sf);border-radius:16px;margin-bottom:12px;overflow:hidden;border:1.5px solid var(--bd);display:flex;align-items:center;cursor:pointer;transition:border .15s}
.seans-kart:active{border-color:var(--ac);background:var(--sf2)}
.seans-info{padding:20px 16px;flex:1}
.seans-saat{font-size:28px;font-weight:800;color:var(--tx);letter-spacing:1px}
.seans-tarih{font-size:13px;color:var(--mu);margin-top:4px}

.seans-chevron{font-size:20px;color:var(--mu);padding-right:16px}

/* TARAMA EKRANI */
.scan-screen{display:none;min-height:100vh}
.scan-topbar{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);background:var(--sf)}
.back-btn{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--bl);background:none;border:none;cursor:pointer;font-weight:500;padding:0}
.seans-saat-label{font-size:18px;font-weight:800;color:var(--ac);letter-spacing:1px}
.liste-btn{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--tx);cursor:pointer;display:flex;align-items:center;gap:6px}

.scan-body{padding:12px}

/* İSTATİSTİK */


/* QR TARA - BÜYÜK */
.qr-card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;overflow:hidden;margin-bottom:16px}
.qr-start-btn{width:100%;padding:0 20px;height:calc(100vh - 320px);min-height:280px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.qr-icon{font-size:96px;line-height:1}
.qr-label{font-size:24px;font-weight:700;color:var(--tx)}
.qr-sub{font-size:15px;color:var(--mu)}
.qr-stop-btn{width:100%;padding:20px;background:var(--rd);color:#fff;border:none;cursor:pointer;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
#qr-reader{width:100%;background:#000;display:none}
#qr-reader video{width:100%!important}

/* MANUEL */
.manuel-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px}
.manuel-title{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;font-weight:600}
.input-row{display:flex;gap:8px;margin-bottom:8px}
.input-row:last-child{margin-bottom:0}
.ti{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;color:var(--tx);font-size:14px;font-family:monospace;outline:none;-webkit-appearance:none}
.ti:focus{border-color:var(--ac)}
.sb{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}

/* SON GİRİŞLER */


/* SONUÇ SHEET */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:50;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--sf);border-radius:24px 24px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px}
.sheet-handle{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 20px}
.r-icon{font-size:64px;text-align:center;margin-bottom:12px;line-height:1}
.r-title{font-size:26px;font-weight:800;text-align:center;margin-bottom:4px;color:var(--tx)}
.r-title.green{color:var(--gn)}
.r-title.red{color:var(--rd)}
.r-name{font-size:18px;font-weight:600;text-align:center;margin-bottom:6px;color:var(--tx)}
.r-info{font-size:14px;color:var(--mu);text-align:center;margin-bottom:20px;line-height:1.7;white-space:pre-line}
.bilet-item{background:var(--sf2);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.bi-no{font-size:12px;font-family:monospace;color:var(--bl);font-weight:600}
.bi-tur{font-size:12px;color:var(--mu);margin-top:2px}
.bi-cb{width:22px;height:22px;accent-color:var(--ac);cursor:pointer}
.bi-status{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.bi-status.ok{background:rgba(74,222,128,.15);color:var(--gn)}
.bi-status.used{background:rgba(248,113,113,.15);color:var(--rd)}
.giris-btn{width:100%;padding:18px;background:var(--gn);color:#000;border:none;border-radius:16px;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px}
.giris-btn:disabled{opacity:.4;cursor:default}
.kapat-btn{width:100%;padding:14px;background:var(--sf2);color:var(--mu);border:none;border-radius:16px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}

/* LİSTE SHEET */
.liste-sheet-title{font-size:18px;font-weight:700;margin-bottom:4px;color:var(--tx)}
.liste-ozet{background:var(--ac);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.liste-ozet-label{font-size:14px;font-weight:600;color:#000}
.liste-ozet-sayi{font-size:22px;font-weight:800;color:#000}
.liste-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--sf2);border-radius:12px;margin-bottom:8px}
.li-name{font-size:14px;font-weight:500;color:var(--tx)}
.li-detail{font-size:12px;color:var(--mu);margin-top:2px}
.li-badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.li-badge.ok{background:rgba(74,222,128,.15);color:var(--gn)}
.li-badge.no{background:rgba(248,113,113,.15);color:var(--rd)}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 20px;font-size:14px;font-weight:500;z-index:100;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;color:var(--tx)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok-t{border-color:rgba(74,222,128,.4);color:var(--gn)}
.toast.err-t{border-color:rgba(248,113,113,.4);color:var(--rd)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-screen">
    <div class="login-logo">
      <div class="star">✦ STARDUST ✦</div>
      <div class="name">Ticket Scan</div>
      
    </div>
    <div class="login-card">
      <label class="fl">Kullanıcı Adı</label>
      <input class="fi" type="text" id="loginEmail" autocapitalize="none" onkeydown="if(event.key==='Enter')doLogin()">
      <label class="fl">Şifre</label>
      <input class="fi" type="password" id="loginPass" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn-login" id="loginBtn" onclick="doLogin()">Giriş Yap</button>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appWrap" style="display:none">
  <div class="header">
    <div>
      <div class="header-logo">✦ STARDUST ✦</div>
      <div class="header-sub">TICKET SCAN</div>
    </div>
    <div class="header-right">
      <span class="header-user" id="userLabel"></span>
      <button class="btn-logout" onclick="doLogout()">Çıkış</button>
    </div>
  </div>

  <!-- SEANS SEÇİMİ -->
  <div class="seans-screen" id="seansScreen">
    <div style="padding:16px">
      <div class="screen-title">Seans Seçimi</div>
      <div class="screen-date" id="screenDate"></div>
      <div id="seansListesi"></div>
    </div>
  </div>

  <!-- TARAMA EKRANI -->
  <div class="scan-screen" id="scanScreen">
    <div class="scan-topbar">
      <button class="back-btn" onclick="goBack()">← Seans Seçimi</button>
      <div class="seans-saat-label" id="scanSaatLabel"></div>
      <button class="liste-btn" onclick="acListeSheet()">☰ Liste</button>
    </div>
    <div class="scan-body">


      <!-- Barkod input - el terminali için -->
      <input id="barcodeHidden" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters"
        placeholder="Okutmaya hazır..."
        style="width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:10px 14px;color:#444;font-size:13px;margin-bottom:12px;outline:none;caret-color:transparent">

      <!-- QR Tara - Büyük -->
      <div class="qr-card">
        <div id="qr-reader"></div>
        <div id="qrStartArea">
          <button class="qr-start-btn" onclick="kameraAc()">
            <div class="qr-icon">📷</div>
            <div class="qr-label">QR Kod Tara</div>
            <div class="qr-sub">Kamerayı başlatmak için dokun</div>
          </button>
        </div>
        <div id="qrStopArea" style="display:none">
          <button class="qr-stop-btn" onclick="kameraKapat()">⏹ Kamerayı Durdur</button>
        </div>
      </div>

      <!-- Manuel / Barkod -->
      <div class="manuel-card">
        <div class="manuel-title">📡 Barkod / Manuel Sorgula</div>
        <div class="input-row">
          <input class="ti" type="text" id="barcodeHidden" 
            placeholder="Tetik çek veya manuel gir..." 
            autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
            style="font-size:15px;padding:14px"
            oninput="otoBarkodKontrol(this.value)"
            onkeydown="if(event.key==='Enter'){otoBarkodSorgula();event.preventDefault();}">
        </div>
        <!-- Gizli eski inputlar - geriye dönük uyumluluk için -->
        <input type="hidden" id="pnrInput">
        <input type="hidden" id="biletNoInput">
      </div>


    </div>
  </div>
</div>

<!-- SONUÇ SHEET -->
<div class="overlay" id="resultOverlay" onclick="if(event.target===this)kapatSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="r-icon" id="rIcon"></div>
    <div class="r-title" id="rTitle"></div>
    <div class="r-name" id="rName"></div>
    <div class="r-info" id="rInfo"></div>
    <div id="rBiletler"></div>
    <button class="giris-btn" id="girisBtn" onclick="girisVer()" style="display:none">✓ Giriş Ver</button>
    <button class="kapat-btn" onclick="kapatSheet()">Kapat</button>
  </div>
</div>

<!-- LİSTE SHEET -->
<div class="overlay" id="listeOverlay" onclick="if(event.target===this)document.getElementById('listeOverlay').classList.remove('open')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="liste-sheet-title" id="listeTitle"></div>
    <div style="font-size:13px;color:var(--mu);margin-bottom:16px" id="listeDate"></div>
    <div class="liste-ozet">
      <div class="liste-ozet-label">Giriş Yapan Kişi Sayısı</div>
      <div class="liste-ozet-sayi" id="listeOzet">0/0</div>
    </div>
    <div id="listeIcerik"></div>
    <button class="kapat-btn" onclick="document.getElementById('listeOverlay').classList.remove('open')">Kapat</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
var scanApp=firebase.initializeApp({
  apiKey:"AIzaSyDcmS7qpzMvc6JIsudyIAROvMy052R0bPs",
  authDomain:"box-office-discount.firebaseapp.com",
  databaseURL:"https://box-office-discount-default-rtdb.firebaseio.com",
  projectId:"box-office-discount",
  storageBucket:"box-office-discount.firebasestorage.app",
  messagingSenderId:"835296643878",
  appId:"1:835296643878:web:44e7a86658b37328ee0fe7"
},'scan-app');
var auth=scanApp.auth(),db=scanApp.database();
var biletlerRef=db.ref('biletler'),ticketsRef=db.ref('tickets'),usersRef=db.ref('users');

function pad(x){return x<10?'0'+x:String(x);}
function todayStr(){var n=new Date();return pad(n.getDate())+'.'+pad(n.getMonth()+1)+'.'+n.getFullYear();}
function addDays(ds,n){var p=ds.split('.');var d=new Date(p[2],p[1]-1,p[0]);d.setDate(d.getDate()+n);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();}
function getDayName(ds){var p=ds.split('.');return['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][new Date(p[2],p[1]-1,p[0]).getDay()];}
function fmtDate(ds){var p=ds.split('.');var m=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];return parseInt(p[0])+' '+m[parseInt(p[1])-1]+' '+p[2]+', '+getDayName(ds);}

var OZEL={'19.05.2026':['20:45','21:00','21:30','22:00'],'28.05.2026':['20:45','21:00','21:30','22:00','22:30']};
var HSEANS={5:['20:45','21:00','21:30','22:00','22:30'],6:['20:45','21:00','21:30','22:00','22:30'],0:['20:45','21:00','21:30','22:00']};
function getSaatler(ds){if(OZEL[ds])return OZEL[ds];var p=ds.split('.');return HSEANS[new Date(p[2],p[1]-1,p[0]).getDay()]||null;}
function isEtkinlik(ds){return getSaatler(ds)!==null;}

var currentUser=null,currentName=null;
var selectedGun=null,selectedSeans=null;
var tickets=[],biletler={},logs=[];
var currentSorgu=null,qrScanner=null;

// BARKOD OKUYUCU BUFFER SİSTEMİ
// El terminali barkod okuyucusu tetiklenince gizli input'a yazar
var barcodeBuffer='';
var barcodeTimer=null;

function setupBarcodeInput(){
  var hidden = document.getElementById('barcodeHidden');
  if(!hidden) return;

  // Her zaman bu input'a odaklan (sheet veya liste açık değilse)
  function refocus(){
    if(document.getElementById('scanScreen').style.display==='none') return;
    if(document.getElementById('resultOverlay').classList.contains('open')) return;
    if(document.getElementById('listeOverlay').classList.contains('open')) return;
    var active = document.activeElement;
    if(active && (active.id==='pnrInput'||active.id==='biletNoInput')) return;
    hidden.focus();
  }

  document.addEventListener('click', function(e){
    setTimeout(refocus, 100);
  });

  hidden.addEventListener('keydown', function(e){
    if(e.key==='Enter'){
      var val = hidden.value.trim().toUpperCase();
      hidden.value = '';
      if(val.length > 3){
        if(qrScanner){ kameraKapat(function(){ islemYap(val); }); }
        else { islemYap(val); }
      }
      e.preventDefault();
    }
  });

  // Input dışında bir yere tıklanınca geri odaklan
  document.addEventListener('touchend', function(e){
    setTimeout(refocus, 200);
  });
}

function otoBarkodKontrol(val){
  // Barkod okuyucu genellikle çok hızlı yazar (50ms'den az)
  // SD- veya PNR- ile başlıyorsa ve yeterince uzunsa otomatik sorgula
  var v = val.trim().toUpperCase();
  if((v.startsWith('SD-') && v.length >= 10) || (v.startsWith('PNR-') && v.length >= 10)){
    clearTimeout(barcodeTimer);
    barcodeTimer = setTimeout(function(){ otoBarkodSorgula(); }, 80);
  }
}

function otoBarkodSorgula(){
  var input = document.getElementById('barcodeHidden');
  var val = input.value.trim().toUpperCase();
  if(!val || val.length < 4) return;
  input.value = '';
  islemYap(val);
}

function islemYap(val){
  if(val.startsWith('SD-')){
    document.getElementById('biletNoInput').value = val;
    sorgulaBiletNo(val);
  } else {
    document.getElementById('pnrInput').value = val;
    sorgulaPNR(val);
  }
}

auth.onAuthStateChanged(function(user){
  if(user){currentUser=user;usersRef.child(user.uid).once('value',function(snap){var ud=snap.val();currentName=ud?ud.name:user.email;showApp();});}
  else{showLogin();}
});

function showLogin(){document.getElementById('loginScreen').style.display='block';document.getElementById('appWrap').style.display='none';}
function showApp(){
  usersRef.child(currentUser.uid).once('value',function(snap){
    var ud=snap.val();
    var role=ud?ud.role:'';
    if(role!=='admin'&&role!=='okutma'){
      auth.signOut();
      document.getElementById('loginErr').textContent='Bu uygulama için yetkiniz yok.';
      return;
    }
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appWrap').style.display='block';
    document.getElementById('userLabel').textContent=currentName||'';
    loadData();
    var today=todayStr();
    selectedGun=today;
    if(!isEtkinlik(today)){
      for(var i=1;i<=14;i++){var d=addDays(today,i);if(isEtkinlik(d)){selectedGun=d;break;}}
    }
    setTimeout(function(){autoSelectSeans();},500);
  });
}
function doLogin(){
  var username=document.getElementById('loginEmail').value.trim().toLowerCase();
  var pass=document.getElementById('loginPass').value;
  var btn=document.getElementById('loginBtn');
  document.getElementById('loginErr').textContent='';
  if(!username||!pass){document.getElementById('loginErr').textContent='Kullanıcı adı ve şifre girin.';return;}
  var email=username.indexOf('@')>-1?username:username+'@stardust.app';
  btn.textContent='Giriş yapılıyor...';btn.disabled=true;
  auth.signInWithEmailAndPassword(email,pass).catch(function(err){
    btn.textContent='Giriş Yap';btn.disabled=false;
    var msg='Giriş başarısız.';
    if(err.code==='auth/wrong-password'||err.code==='auth/user-not-found'||err.code==='auth/invalid-credential')msg='Kullanıcı adı veya şifre hatalı.';
    else if(err.code==='auth/too-many-requests')msg='Çok fazla deneme. Bekleyin.';
    document.getElementById('loginErr').textContent=msg;
  });
}
function doLogout(){if(qrScanner)qrScanner.stop().catch(function(){});auth.signOut();}

function loadData(){
  ticketsRef.on('value',function(snap){tickets=Object.values(snap.val()||{}).filter(Boolean);updateStats();});
  biletlerRef.on('value',function(snap){biletler=snap.val()||{};updateStats();});
}

function updateStats(){
  if(!selectedGun||!selectedSeans)return;
  var gb=Object.values(biletler).filter(function(b){return b&&b.tarih===selectedGun&&b.seans===selectedSeans;});
  document.getElementById('statToplam').textContent=gb.length;
  document.getElementById('statGiris').textContent=gb.filter(function(b){return b.kullanildi;}).length;
}



function buildSeansListesi(){
  var today=todayStr();
  selectedGun=today;
  if(!isEtkinlik(today)){
    for(var i=1;i<=14;i++){var d=addDays(today,i);if(isEtkinlik(d)){selectedGun=d;break;}}
  }
  document.getElementById('screenDate').textContent=fmtDate(selectedGun);
  var liste=document.getElementById('seansListesi');
  liste.innerHTML='';
  var saatler=getSaatler(selectedGun)||[];
  saatler.forEach(function(saat){
    var kart=document.createElement('div');
    kart.className='seans-kart';
    var gb=Object.values(biletler).filter(function(b){return b&&b.tarih===selectedGun&&b.seans===saat;});
    var giris=gb.filter(function(b){return b.kullanildi;}).length;
    var statTxt=gb.length>0?(giris+' / '+gb.length+' giriş yapıldı'):'Henüz satış yok';
    kart.innerHTML=
      '<div class="seans-info">'+
        '<div class="seans-saat">'+saat+'</div>'+
        '<div class="seans-tarih">'+selectedGun+'</div>'+
      '</div>'+
      '<div class="seans-chevron">›</div>';
    (function(s){kart.onclick=function(){selectSeans(s);};})(saat);
    liste.appendChild(kart);
  });
}

function selectSeans(saat){
  selectedSeans=saat;
  document.getElementById('seansScreen').style.display='none';
  document.getElementById('scanScreen').style.display='block';
  document.getElementById('scanSaatLabel').textContent=saat;
  updateStats();
  setupBarcodeInput();
  setTimeout(function(){
    var hidden=document.getElementById('barcodeHidden');
    if(hidden) hidden.focus();
  }, 300);  updateStats();logs=[];renderLogs();
}

function autoSelectSeans(){
  // Bugünün en yakın seansını otomatik seç
  var now=new Date();
  var saatler=getSaatler(selectedGun)||[];
  if(saatler.length===0) return;
  var nowMin=now.getHours()*60+now.getMinutes();
  // En yakın gelecek seansı bul, yoksa son seansı seç
  var secili=saatler[saatler.length-1];
  for(var i=0;i<saatler.length;i++){
    var p=saatler[i].split(':');
    var sMin=parseInt(p[0])*60+parseInt(p[1]);
    if(sMin>=nowMin-30){secili=saatler[i];break;}
  }
  selectSeans(secili);
}

function goBack(){
  kameraKapat();
  document.getElementById('scanScreen').style.display='none';
  document.getElementById('seansScreen').style.display='block';
  selectedSeans=null;
  buildSeansListesi();
}

// KAMERA
function kameraAc(){
  document.getElementById('qrStartArea').style.display='none';
  document.getElementById('qr-reader').style.display='block';
  document.getElementById('qrStopArea').style.display='block';
  qrScanner=new Html5Qrcode('qr-reader');
  qrScanner.start(
    {facingMode:'environment'},
    {fps:10,qrbox:{width:260,height:260}},
    function(text){
      var val=text.trim().toUpperCase();
      kameraKapat(function(){
        if(val.startsWith('SD-')){document.getElementById('biletNoInput').value=val;sorgulaBiletNo();}
        else{document.getElementById('pnrInput').value=val;sorgulaPNR();}
      });
    },
    function(){}
  ).catch(function(){toast('Kamera açılamadı','err');kameraKapat();});
}
function kameraKapat(callback){
  document.getElementById('qr-reader').style.display='none';
  document.getElementById('qrStartArea').style.display='block';
  document.getElementById('qrStopArea').style.display='none';
  if(qrScanner){
    qrScanner.stop().catch(function(){}).finally(function(){
      qrScanner=null;
      if(callback) callback();
    });
  } else {
    if(callback) callback();
  }
}

// LİSTE
function acListeSheet(){
  if(!selectedGun||!selectedSeans){toast('Seans seçin','err');return;}
  var pnrler=tickets.filter(function(t){return t&&t.tarih===selectedGun&&t.seans===selectedSeans;});
  var gb=Object.values(biletler).filter(function(b){return b&&b.tarih===selectedGun&&b.seans===selectedSeans;});
  var giris=gb.filter(function(b){return b.kullanildi;}).length;

  document.getElementById('listeTitle').textContent='Seans '+selectedSeans;
  document.getElementById('listeDate').textContent=selectedGun;
  document.getElementById('listeOzet').textContent=giris+'/'+gb.length;

  var icerik=document.getElementById('listeIcerik');
  icerik.innerHTML='';

  if(pnrler.length===0){
    icerik.innerHTML='<div style="text-align:center;padding:24px;color:var(--mu);font-size:14px">Bu seans için henüz satış yok.</div>';
  } else {
    pnrler.forEach(function(t){
      var pnrBiletler=gb.filter(function(b){return t.biletler&&t.biletler.indexOf(b.tarih+'_'+b.seans)>-1;});
      // PNR'ın biletlerini kontrol et
      var pnrGiris=t.biletler?t.biletler.filter(function(bno){return biletler[bno]&&biletler[bno].kullanildi;}).length:0;
      var pnrToplam=t.biletler?t.biletler.length:((t.tam||0)+(t.cocuk||0)+(t.yabanci||0)+(t.davetli||0));
      var girisYapti=pnrGiris>0;

      // Giriş saatini bul
      var girisZamani='';
      if(girisYapti&&t.biletler){
        t.biletler.forEach(function(bno){
          if(biletler[bno]&&biletler[bno].kullanildi&&biletler[bno].kullanildiSaat){
            girisZamani=biletler[bno].kullanildiSaat;
          }
        });
      }

      var item=document.createElement('div');
      item.className='liste-item';
      item.innerHTML=
        '<div>'+
          '<div class="li-name">'+t.musteriAd+'</div>'+
          '<div class="li-detail">Tam: '+(t.tam||0)+' · Çocuk: '+(t.cocuk||0)+(t.yabanci>0?' · Yabancı: '+t.yabanci:'')+'</div>'+
        '</div>'+
        '<div style="text-align:right">'+
          '<span class="li-badge '+(girisYapti?'ok':'no')+'">'+(girisYapti?(pnrGiris+'/'+pnrToplam+' Girdi'):'Giriş Yapmadı')+'</span>'+
          (girisYapti&&girisZamani?'<div style="font-size:11px;color:var(--mu);margin-top:4px;font-family:monospace">'+girisZamani+'</div>':'')+
        '</div>';
      icerik.appendChild(item);
    });
  }
  document.getElementById('listeOverlay').classList.add('open');
}

// SORGU
function kapatSheet(){
  document.getElementById('resultOverlay').classList.remove('open');
  currentSorgu=null;
  setTimeout(function(){
    var hidden=document.getElementById('barcodeHidden');
    if(hidden) hidden.focus();
  }, 300);
}

function showSheet(icon,title,cls,name,info,biletHTML,giris){
  document.getElementById('rIcon').textContent=icon;
  document.getElementById('rTitle').textContent=title;
  document.getElementById('rTitle').className='r-title '+(cls||'');
  document.getElementById('rName').textContent=name||'';
  document.getElementById('rInfo').textContent=info||'';
  document.getElementById('rBiletler').innerHTML=biletHTML||'';
  document.getElementById('girisBtn').style.display=giris?'block':'none';
  document.getElementById('girisBtn').disabled=false;
  document.getElementById('resultOverlay').classList.add('open');
}

function sorgulaPNR(valParam){
  var val=(valParam||document.getElementById('pnrInput').value||'').toString().trim().toUpperCase();
  if(!val){toast('PNR giriniz','err');return;}
  currentSorgu=null;
  db.ref('pnrler/'+val).once('value',function(snap){
    var p=snap.val();
    if(!p){showSheet('✗','PNR Bulunamadı','red','','Bu PNR sistemde kayıtlı değil.','',false);return;}
    // Seans kontrolü
    if(p.tarih!==selectedGun||p.seans!==selectedSeans){
      showSheet('⚠️','Yanlış Seans','red',p.musteriAd,'Bu bilet '+p.tarih+' · Seans '+p.seans+' için geçerlidir.\nŞu an: '+selectedGun+' · Seans '+selectedSeans,'',false);
      return;
    }
    var biletNoList=p.biletler||[];
    var promises=biletNoList.map(function(bno){return biletlerRef.child(bno).once('value').then(function(bs){return{no:bno,data:bs.val()};});});
    Promise.all(promises).then(function(results){
      var bekleyenler=results.filter(function(b){return b.data&&!b.data.kullanildi;});
      if(bekleyenler.length===0){showSheet('✗','Tümü Kullanılmış','red',p.musteriAd,p.tarih+' · Seans '+p.seans,'',false);return;}
      var html='';
      results.forEach(function(b){
        var used=b.data&&b.data.kullanildi;
        html+='<div class="bilet-item"><div><div class="bi-no">'+b.no+'</div><div class="bi-tur">'+(b.data?b.data.tur:'-')+'</div></div>'+
          '<div style="display:flex;align-items:center;gap:8px">'+(!used?'<input type="checkbox" class="bi-cb" data-no="'+b.no+'" checked>':'')+
          '<span class="bi-status '+(used?'used':'ok')+'">'+(used?'Kullanıldı':'Bekliyor')+'</span></div></div>';
      });
      currentSorgu={type:'pnr',pnr:val,data:p,bekleyenler:bekleyenler.map(function(b){return b.no;})};
      showSheet('📋','PNR Bulundu','',p.musteriAd,p.tarih+' · Seans '+p.seans+'\nTam: '+(p.tam||0)+' · Çocuk: '+(p.cocuk||0)+' · Yabancı: '+(p.yabanci||0),html,true);
    });
  });
}

function sorgulaBiletNo(valParam){
  var val=(valParam||document.getElementById('biletNoInput').value||'').toString().trim().toUpperCase();
  if(!val){toast('Bilet no giriniz','err');return;}
  currentSorgu=null;
  biletlerRef.child(val).once('value',function(snap){
    var b=snap.val();
    if(!b){showSheet('✗','Geçersiz Bilet','red','','Bu bilet bulunamadı.','',false);return;}
    // Seans kontrolü
    if(b.tarih!==selectedGun||b.seans!==selectedSeans){
      showSheet('⚠️','Yanlış Seans','red',b.musteriAd||'','Bu bilet '+b.tarih+' · Seans '+b.seans+' için geçerlidir.\nŞu an: '+selectedGun+' · Seans '+selectedSeans,'',false);
      return;
    }
    if(b.kullanildi){showSheet('✗','Kullanılmış','red',b.musteriAd||'',b.kullanildiSaat+' saatinde giriş yapıldı.','',false);return;}
    currentSorgu={type:'bilet',no:val,data:b};
    showSheet('✓','Bilet Geçerli','green',b.musteriAd||'','Seans: '+b.seans+' · '+b.tur+'\n'+b.tarih,'',true);
  });
}

function girisVer(){
  if(!currentSorgu)return;
  var now=new Date();var saat=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  document.getElementById('girisBtn').disabled=true;
  if(currentSorgu.type==='pnr'){
    var p=currentSorgu.data;
    var secili=[];
    document.querySelectorAll('.bi-cb:checked').forEach(function(cb){secili.push(cb.getAttribute('data-no'));});
    if(secili.length===0){toast('En az 1 bilet seçin','err');document.getElementById('girisBtn').disabled=false;return;}
    secili.forEach(function(bno){biletlerRef.child(bno).update({kullanildi:true,kullanildiSaat:saat});});
    if(secili.length>=currentSorgu.bekleyenler.length)db.ref('pnrler/'+currentSorgu.pnr).update({kullanildi:true,kullanildiSaat:saat});
    addLog(p.musteriAd||'-',p.seans,saat,secili.length+' bilet');
    toast('✓ '+secili.length+' bilete giriş verildi!','ok');
  } else {
    var b=currentSorgu.data;
    biletlerRef.child(currentSorgu.no).update({kullanildi:true,kullanildiSaat:saat});
    addLog(b.musteriAd||'-',b.seans,saat,b.tur);
    toast('✓ Giriş verildi!','ok');
  }
  updateStats();
  kapatSheet();
  setTimeout(function(){ kameraAc(); }, 350);
  document.getElementById('pnrInput').value='';
  document.getElementById('biletNoInput').value='';
}

function addLog(name,seans,saat,tur){
  logs.unshift({name:name,seans:seans,saat:saat,tur:tur});
  if(logs.length>30)logs.pop();
  renderLogs();
}
function renderLogs(){
  var el=document.getElementById('logList');
  if(!logs.length){el.innerHTML='<div class="log-empty">Henüz giriş yok</div>';return;}
  el.innerHTML='';
  logs.forEach(function(l){
    var item=document.createElement('div');item.className='log-item';
    item.innerHTML='<div style="display:flex;align-items:center;flex:1"><div class="log-dot"></div><div><div class="log-name">'+l.name+'</div><div class="log-detail">'+l.tur+'</div></div></div><div class="log-time">'+l.saat+'</div>';
    el.appendChild(item);
  });
}

var tt;
function toast(msg,type){
  var el=document.getElementById('toast');
  el.textContent=msg;el.className='toast show '+(type==='err'?'err-t':'ok-t');
  clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show');},2500);
}
</script>
