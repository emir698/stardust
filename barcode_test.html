<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barkod Test</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;padding:20px;max-width:430px;margin:0 auto}
h2{color:#e8c547;margin-bottom:20px}
.log{background:#1a1a1a;border-radius:12px;padding:16px;margin-bottom:12px;font-family:monospace;font-size:13px;border:1px solid #2a2a2a}
.log span{color:#4ade80}
.input-box{width:100%;background:#1a1a1a;border:1px solid #e8c547;border-radius:12px;padding:14px;color:#fff;font-size:16px;margin-bottom:12px;box-sizing:border-box}
.clear-btn{background:#e8c547;color:#000;border:none;border-radius:10px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
#events{max-height:400px;overflow-y:auto}
</style>
</head>
<body>
<h2>🔍 Barkod Okuyucu Test</h2>
<p style="color:#888;font-size:13px;margin-bottom:16px">Aşağıdaki kutuya tıkla, sonra tetik çek. Ne geldiğini görelim.</p>

<input class="input-box" id="testInput" placeholder="Buraya tıkla, sonra tetik çek..." autofocus>

<div style="color:#888;font-size:12px;margin-bottom:8px">Olaylar:</div>
<div id="events"></div>
<button class="clear-btn" onclick="document.getElementById('events').innerHTML='';document.getElementById('testInput').value=''">Temizle</button>

<script>
var eventsEl = document.getElementById('events');
var inputEl = document.getElementById('testInput');

function log(msg, color){
  var d = document.createElement('div');
  d.className = 'log';
  d.innerHTML = '<span style="color:'+(color||'#4ade80')+'">'+new Date().toLocaleTimeString()+'</span> '+msg;
  eventsEl.insertBefore(d, eventsEl.firstChild);
}

inputEl.addEventListener('keydown', function(e){
  log('keydown: key=<b>'+e.key+'</b> code='+e.code+' keyCode='+e.keyCode);
});
inputEl.addEventListener('input', function(e){
  log('input: value=<b>'+this.value+'</b>', '#60a5fa');
});
inputEl.addEventListener('change', function(e){
  log('change: value=<b>'+this.value+'</b>', '#f97316');
});
inputEl.addEventListener('keyup', function(e){
  if(e.key==='Enter'){
    log('✅ ENTER geldi! Değer: <b>'+inputEl.value+'</b>', '#e8c547');
  }
});

document.addEventListener('keydown', function(e){
  if(document.activeElement !== inputEl){
    log('⚠️ Odak dışında keydown: <b>'+e.key+'</b>', '#f87171');
  }
});
</script>
</body>
</html>
